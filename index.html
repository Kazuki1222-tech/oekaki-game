<!doctype html>
<html lang='ja'>
<head>
  <meta charset='utf-8' />
  <meta name='viewport' content='width=device-width, initial-scale=1, viewport-fit=cover' />
  <title>おえかきキャッチゲーム</title>
  <style>
    :root { --bg1:#fff7d6; --bg2:#d7f3ff; --ink:#2f2a25; --accent:#ff8a65; --app-height:100svh; }
    * { box-sizing:border-box; }
    html { width:100%; height:100%; overflow:hidden; }
    body {
      margin:0;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      color:var(--ink);
      background:linear-gradient(180deg,var(--bg2),var(--bg1));
      min-height:var(--app-height);
      overflow:hidden;
      touch-action:none;
      user-select:none;
    }
    .app {
      width:100vw;
      height:var(--app-height);
      display:grid;
      place-items:center;
      padding:max(8px,env(safe-area-inset-top)) 10px max(8px,env(safe-area-inset-bottom));
    }
    .panel {
      width:min(560px,100%);
      height:min(720px,100%);
      min-height:0;
      border-radius:28px;
      padding:18px;
      background:rgba(255,255,255,.84);
      box-shadow:0 18px 50px rgba(0,0,0,.14);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:12px;
      text-align:center;
    }
    h1 { margin:0; font-size:clamp(32px,9vw,56px); line-height:1.05; }
    p { margin:0; font-size:16px; line-height:1.6; }
    button {
      border:0;
      border-radius:999px;
      padding:15px 24px;
      font-size:18px;
      font-weight:800;
      color:white;
      background:var(--accent);
      box-shadow:0 8px 0 rgba(180,80,50,.35);
    }
    button:active { transform:translateY(3px); box-shadow:0 5px 0 rgba(180,80,50,.35); }
    .character-grid {
      width:100%;
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:12px;
    }
    .card {
      border:3px solid rgba(0,0,0,.08);
      border-radius:18px;
      padding:12px 8px;
      background:white;
      min-height:138px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:8px;
      overflow:hidden;
    }
    .thumb { width:72px; height:72px; object-fit:contain; display:block; }
    .emoji { font-size:48px; line-height:1; }
    .name { font-weight:800; font-size:15px; }
    #game.panel { justify-content:flex-start; }
    #gameWrap { width:100%; height:100%; min-height:0; display:flex; flex-direction:column; gap:8px; }
    .hud { flex:0 0 auto; display:flex; justify-content:space-between; align-items:center; width:100%; font-weight:900; font-size:clamp(16px,4.6vw,20px); }
    .shop { flex:0 0 auto; width:100%; display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
    .shop button { padding:8px 12px; font-size:13px; box-shadow:0 3px 0 rgba(180,80,50,.35); }
    .shop button:active { transform:translateY(1px); box-shadow:0 2px 0 rgba(180,80,50,.35); }
    .end-button { flex:0 0 auto; padding:8px 14px; font-size:14px; box-shadow:0 4px 0 rgba(180,80,50,.35); }
    .end-button:active { transform:translateY(2px); box-shadow:0 2px 0 rgba(180,80,50,.35); }
    canvas {
      width:100%;
      height:100%;
      flex:1 1 auto;
      min-height:0;
      display:block;
      border-radius:20px;
      background:linear-gradient(180deg,#b7edff 0%,#fff4b8 100%);
      box-shadow:inset 0 0 0 4px rgba(255,255,255,.7);
      touch-action:none;
    }
    .hidden { display:none !important; }
    .small { font-size:13px; opacity:.72; }
    @media (max-height:620px) {
      .panel { padding:12px; border-radius:22px; }
      #gameWrap { gap:6px; }
      canvas { border-radius:18px; }
    }
  </style>
</head>
<body>
  <main class='app'>
    <section id='title' class='panel'>
      <h1>おえかき<br>キャッチ</h1>
      <p>えらんだキャラをゆびでうごかして、ほしをあつめよう。</p>
      <button id='startBtn'>はじめる</button>
      <p class='small'>娘さんの絵をキャラとして入れました v3</p>
    </section>

    <section id='select' class='panel hidden'>
      <h1>キャラをえらぶ</h1>
      <div id='characterGrid' class='character-grid'></div>
      <div class='shop'>
        <button id='menuClothBtn'>ふくチェンジ</button>
        <button id='menuHairBtn'>かみチェンジ</button>
      </div>
      <p class='small'>メニューで見た目を決めてからスタート！</p>
      <button id='backTitleBtn'>もどる</button>
    </section>

    <section id='game' class='panel hidden'>
      <div id='gameWrap'>
        <div class='hud'><span id='scoreText'>スコア 0</span><button id='endBtn' class='end-button'>おわる</button><span id='timeText'>30</span></div>
        <canvas id='canvas' width='720' height='980'></canvas>
      </div>
    </section>

    <section id='result' class='panel hidden'>
      <h1>おしまい！</h1>
      <p id='resultText'>スコア 0</p>
      <button id='againBtn'>もういちど</button>
      <button id='selectAgainBtn'>キャラをかえる</button>
    </section>
  </main>

<script>
function setAppHeight() {
  const viewport = window.visualViewport;
  const height = viewport ? viewport.height : window.innerHeight;
  document.documentElement.style.setProperty('--app-height', `${height}px`);
}
setAppHeight();
window.addEventListener('resize', setAppHeight);
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', setAppHeight);
  window.visualViewport.addEventListener('scroll', setAppHeight);
}

// 画像は index.html へbase64直貼りしない。assets配下の素材を参照する。
const OEKAKI_IMAGE = 'assets/ch_001_oekaki.svg';

const characters = [
  { id:'oekaki01', name:'おえかきちゃん', emoji:'🎨', image:OEKAKI_IMAGE, speed:1.0, size:170 },
  { id:'usagi', name:'うさぎ', emoji:'🐰', image:'', speed:1.05, size:96 },
  { id:'neko', name:'ねこ', emoji:'🐱', image:'', speed:1.0, size:96 }
];

const screens = {
  title: document.getElementById('title'),
  select: document.getElementById('select'),
  game: document.getElementById('game'),
  result: document.getElementById('result')
};
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const scoreText = document.getElementById('scoreText');
const timeText = document.getElementById('timeText');
const resultText = document.getElementById('resultText');
const endBtn = document.getElementById('endBtn');

let selected = characters[0];
let player, items, score, timeLeft, lastTime, spawnTimer, rafId, running;
let audioCtx = null;
let bgmNodes = null;
let lastCatchSoundAt = 0;
const styleState = { cloth:0, hair:0 };
const imageCache = new Map();

function show(name) {
  Object.values(screens).forEach(s => s.classList.add('hidden'));
  screens[name].classList.remove('hidden');
}

function getAudioContext() {
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  if (!AudioContext) return null;
  if (!audioCtx) audioCtx = new AudioContext();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playTone(frequency, duration = 0.08, delay = 0, type = 'sine', volume = 0.04) {
  const soundCtx = getAudioContext();
  if (!soundCtx) return;
  const oscillator = soundCtx.createOscillator();
  const gain = soundCtx.createGain();
  const start = soundCtx.currentTime + delay;
  const end = start + duration;
  oscillator.type = type;
  oscillator.frequency.setValueAtTime(frequency, start);
  gain.gain.setValueAtTime(0.0001, start);
  gain.gain.exponentialRampToValueAtTime(volume, start + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, end);
  oscillator.connect(gain);
  gain.connect(soundCtx.destination);
  oscillator.start(start);
  oscillator.stop(end + 0.02);
}

function playSound(name) {
  if (name === 'start') {
    playTone(523.25, 0.08, 0, 'triangle', 0.045);
    playTone(659.25, 0.09, 0.08, 'triangle', 0.045);
  } else if (name === 'catch') {
    const now = performance.now();
    if (now - lastCatchSoundAt < 70) return;
    lastCatchSoundAt = now;
    playTone(880, 0.055, 0, 'sine', 0.04);
    playTone(1174.66, 0.065, 0.055, 'sine', 0.035);
  } else if (name === 'finish') {
    playTone(659.25, 0.10, 0, 'square', 0.035);
    playTone(523.25, 0.12, 0.11, 'square', 0.03);
  }
}


function startBgm() {
  const soundCtx = getAudioContext();
  if (!soundCtx) return;
  if (bgmNodes) return;
  const master = soundCtx.createGain();
  master.gain.value = 0.025;
  master.connect(soundCtx.destination);

  const notes = [261.63, 329.63, 392.0, 329.63];
  let step = 0;
  const tick = () => {
    if (!running || !bgmNodes) return;
    const osc = soundCtx.createOscillator();
    const gain = soundCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.value = notes[step % notes.length];
    gain.gain.value = 0.0001;
    gain.gain.exponentialRampToValueAtTime(0.7, soundCtx.currentTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, soundCtx.currentTime + 0.44);
    osc.connect(gain);
    gain.connect(master);
    osc.start();
    osc.stop(soundCtx.currentTime + 0.45);
    step++;
    bgmNodes.timer = setTimeout(tick, 420);
  };

  bgmNodes = { master, timer:null };
  tick();
}

function stopBgm() {
  if (!bgmNodes) return;
  clearTimeout(bgmNodes.timer);
  try { bgmNodes.master.disconnect(); } catch (e) {}
  bgmNodes = null;
}

function loadImage(path) {
  if (!path) return null;
  if (imageCache.has(path)) return imageCache.get(path);
  const img = new Image();
  img.src = path;
  imageCache.set(path, img);
  return img;
}

function createEmojiFace(ch) {
  const emoji = document.createElement('div');
  emoji.className = 'emoji';
  emoji.textContent = ch.emoji || '🎨';
  return emoji;
}

function createFace(ch) {
  if (!ch.image) return createEmojiFace(ch);

  const img = document.createElement('img');
  img.className = 'thumb';
  img.src = ch.image;
  img.alt = ch.name;
  img.onerror = () => {
    img.replaceWith(createEmojiFace(ch));
  };
  return img;
}

function renderCharacters() {
  const grid = document.getElementById('characterGrid');
  grid.innerHTML = '';
  characters.forEach(ch => {
    const card = document.createElement('button');
    card.className = 'card';

    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = ch.name;

    card.appendChild(createFace(ch));
    card.appendChild(name);
    card.onclick = () => { selected = ch; startGame(); };
    grid.appendChild(card);
  });
}

function resetGame() {
  score = 0;
  timeLeft = 30;
  items = [];
  spawnTimer = 0;
  running = true;
  player = {
    x: canvas.width / 2,
    y: canvas.height - 220,
    size: selected.size,
    targetX: canvas.width / 2
  };
  scoreText.textContent = 'スコア 0';
  timeText.textContent = '30';
  lastTime = performance.now();
}

function finishGame() {
  if (!running) return;
  running = false;
  cancelAnimationFrame(rafId);
  playSound('finish');
  stopBgm();
  show('result');
  resultText.textContent = `${selected.name}のスコア：${score}`;
}

function startGame() {
  show('game');
  setAppHeight();
  resetGame();
  playSound('start');
  startBgm();
  cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(loop);
}

function spawnItem() {
  const kinds = ['⭐','🍎','💖'];
  items.push({
    x: 50 + Math.random() * (canvas.width - 100),
    y: -40,
    r: 30,
    v: 210 + Math.random() * 130,
    mark: kinds[Math.floor(Math.random() * kinds.length)]
  });
}

function drawPlayer() {
  const img = loadImage(selected.image);
  const s = player.size;
  if (img && img.complete && img.naturalWidth) {
    const ratio = img.naturalWidth / img.naturalHeight;
    const dw = ratio >= 1 ? s : s * ratio;
    const dh = ratio >= 1 ? s / ratio : s;
    ctx.drawImage(img, player.x - dw / 2, player.y - dh / 2, dw, dh);
  } else {
    ctx.font = `${s}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(selected.emoji || '🎨', player.x, player.y);
  }
}

function loop(now) {
  if (!running) return;

  const dt = Math.min((now - lastTime) / 1000, 0.033);
  lastTime = now;
  timeLeft -= dt;
  spawnTimer -= dt;

  if (spawnTimer <= 0) {
    spawnItem();
    spawnTimer = 0.55;
  }

  player.x += (player.targetX - player.x) * 0.25 * selected.speed;
  player.x = Math.max(player.size / 2, Math.min(canvas.width - player.size / 2, player.x));

  items.forEach(it => it.y += it.v * dt);
  items = items.filter(it => {
    const dx = it.x - player.x;
    const dy = it.y - player.y;
    if (Math.hypot(dx, dy) < it.r + player.size * 0.26) {
      score += 1;
      playSound('catch');
      scoreText.textContent = `スコア ${score}`;
      return false;
    }
    return it.y < canvas.height + 60;
  });

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = 'rgba(255,255,255,.55)';
  for (let i = 0; i < 6; i++) {
    ctx.beginPath();
    ctx.arc(80 + i * 120, 90 + (i % 2) * 45, 34, 0, Math.PI * 2);
    ctx.fill();
  }

  items.forEach(it => {
    ctx.font = '48px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(it.mark, it.x, it.y);
  });

  drawPlayer();

  if (styleState.cloth) {
    ctx.fillStyle = ['#ff8a65','#4db6ac','#9575cd'][styleState.cloth % 3];
    ctx.fillRect(player.x - 28, player.y + 45, 56, 24);
  }
  if (styleState.hair) {
    ctx.font = '32px serif';
    ctx.fillText(['🎀','🧢','⭐'][styleState.hair % 3], player.x, player.y - 62);
  }
  timeText.textContent = Math.max(0, Math.ceil(timeLeft));

  if (timeLeft <= 0) {
    finishGame();
    return;
  }

  rafId = requestAnimationFrame(loop);
}

function pointerToCanvasX(e) {
  const rect = canvas.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  return (clientX - rect.left) / rect.width * canvas.width;
}

canvas.addEventListener('pointerdown', e => { if (player) player.targetX = pointerToCanvasX(e); });
canvas.addEventListener('pointermove', e => { if (player) player.targetX = pointerToCanvasX(e); });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (player) player.targetX = pointerToCanvasX(e);
}, { passive:false });

document.getElementById('startBtn').onclick = () => { renderCharacters(); show('select'); };
document.getElementById('backTitleBtn').onclick = () => show('title');
document.getElementById('againBtn').onclick = () => startGame();
document.getElementById('selectAgainBtn').onclick = () => { renderCharacters(); show('select'); };
endBtn.onclick = () => finishGame();
document.getElementById('menuClothBtn').onclick = () => { styleState.cloth++; };
document.getElementById('menuHairBtn').onclick = () => { styleState.hair++; };

renderCharacters();
</script>
</body>
</html>

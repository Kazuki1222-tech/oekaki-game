<!doctype html>
<html lang='ja'>
<head>
  <meta charset='utf-8' />
  <meta name='viewport' content='width=device-width, initial-scale=1, viewport-fit=cover' />
  <title>おえかきキャッチゲーム</title>
  <style>
    :root { --bg1:#fff7d6; --bg2:#d7f3ff; --ink:#2f2a25; --accent:#ff8a65; }
    * { box-sizing:border-box; }
    body {
      margin:0;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      color:var(--ink);
      background:linear-gradient(180deg,var(--bg2),var(--bg1));
      min-height:100svh;
      overflow:hidden;
      touch-action:none;
      user-select:none;
    }
    .app {
      width:100vw;
      height:100svh;
      display:grid;
      place-items:center;
      padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));
    }
    .panel {
      width:min(560px,100%);
      min-height:min(720px,92svh);
      border-radius:28px;
      padding:22px;
      background:rgba(255,255,255,.84);
      box-shadow:0 18px 50px rgba(0,0,0,.14);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:16px;
      text-align:center;
    }
    h1 { margin:0; font-size:clamp(32px,9vw,56px); line-height:1.05; }
    p { margin:0; font-size:16px; line-height:1.6; }
    button {
      border:0;
      border-radius:999px;
      padding:15px 24px;
      font-size:18px;
      font-weight:800;
      color:white;
      background:var(--accent);
      box-shadow:0 8px 0 rgba(180,80,50,.35);
    }
    button:active { transform:translateY(3px); box-shadow:0 5px 0 rgba(180,80,50,.35); }
    .character-grid {
      width:100%;
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:12px;
    }
    .card {
      border:3px solid rgba(0,0,0,.08);
      border-radius:18px;
      padding:12px 8px;
      background:white;
      min-height:138px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:8px;
      overflow:hidden;
    }
    .thumb { width:72px; height:72px; object-fit:contain; display:block; }
    .emoji { font-size:48px; line-height:1; }
    .name { font-weight:800; font-size:15px; }
    #gameWrap { width:100%; height:100%; display:flex; flex-direction:column; gap:10px; }
    .hud { display:flex; justify-content:space-between; align-items:center; width:100%; font-weight:900; font-size:18px; }
    canvas {
      width:100%;
      flex:1;
      min-height:520px;
      border-radius:22px;
      background:linear-gradient(180deg,#b7edff 0%,#fff4b8 100%);
      box-shadow:inset 0 0 0 4px rgba(255,255,255,.7);
      touch-action:none;
    }
    .hidden { display:none !important; }
    .small { font-size:13px; opacity:.72; }
  </style>
</head>
<body>
  <main class='app'>
    <section id='title' class='panel'>
      <h1>おえかき<br>キャッチ</h1>
      <p>えらんだキャラをゆびでうごかして、ほしをあつめよう。</p>
      <button id='startBtn'>はじめる</button>
      <p class='small'>娘さんの絵をキャラとして入れました</p>
    </section>

    <section id='select' class='panel hidden'>
      <h1>キャラをえらぶ</h1>
      <div id='characterGrid' class='character-grid'></div>
      <button id='backTitleBtn'>もどる</button>
    </section>

    <section id='game' class='panel hidden'>
      <div id='gameWrap'>
        <div class='hud'><span id='scoreText'>スコア 0</span><span id='timeText'>30</span></div>
        <canvas id='canvas' width='720' height='980'></canvas>
      </div>
    </section>

    <section id='result' class='panel hidden'>
      <h1>おしまい！</h1>
      <p id='resultText'>スコア 0</p>
      <button id='againBtn'>もういちど</button>
      <button id='selectAgainBtn'>キャラをかえる</button>
    </section>
  </main>

<script>

/9ZgPnvswfNqHbUXvf1BndxaS051RJi3CUNM2EZRtRMjPcM/vCW7gfQk//fxj1K/wTIUGjDv2w5h0IblH+Y//sHG7m5rY03t8l/ySZoa5N8MoH7rjPA/weu1Cn6CsrEmAAAAABJRU5ErkJggg==';

const characters = [
  { id:'oekaki01', name:'おえかきちゃん', emoji:'🎨', image:OEKAKI_IMAGE, speed:1.0, size:190 },
  { id:'usagi', name:'うさぎ', emoji:'🐰', image:'', speed:1.05, size:96 },
  { id:'neko', name:'ねこ', emoji:'🐱', image:'', speed:1.0, size:96 }
];

const screens = {
  title: document.getElementById('title'),
  select: document.getElementById('select'),
  game: document.getElementById('game'),
  result: document.getElementById('result')
};
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const scoreText = document.getElementById('scoreText');
const timeText = document.getElementById('timeText');
const resultText = document.getElementById('resultText');

let selected = characters[0];
let player, items, score, timeLeft, lastTime, spawnTimer, rafId, running;
let audioCtx = null;
let lastCatchSoundAt = 0;
const imageCache = new Map();

function show(name) {
  Object.values(screens).forEach(s => s.classList.add('hidden'));
  screens[name].classList.remove('hidden');
}

function getAudioContext() {
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  if (!AudioContext) return null;
  if (!audioCtx) audioCtx = new AudioContext();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playTone(frequency, duration = 0.08, delay = 0, type = 'sine', volume = 0.04) {
  const soundCtx = getAudioContext();
  if (!soundCtx) return;
  const oscillator = soundCtx.createOscillator();
  const gain = soundCtx.createGain();
  const start = soundCtx.currentTime + delay;
  const end = start + duration;
  oscillator.type = type;
  oscillator.frequency.setValueAtTime(frequency, start);
  gain.gain.setValueAtTime(0.0001, start);
  gain.gain.exponentialRampToValueAtTime(volume, start + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, end);
  oscillator.connect(gain);
  gain.connect(soundCtx.destination);
  oscillator.start(start);
  oscillator.stop(end + 0.02);
}

function playSound(name) {
  if (name === 'start') {
    playTone(523.25, 0.08, 0, 'triangle', 0.045);
    playTone(659.25, 0.09, 0.08, 'triangle', 0.045);
  } else if (name === 'catch') {
    const now = performance.now();
    if (now - lastCatchSoundAt < 70) return;
    lastCatchSoundAt = now;
    playTone(880, 0.055, 0, 'sine', 0.04);
    playTone(1174.66, 0.065, 0.055, 'sine', 0.035);
  } else if (name === 'finish') {
    playTone(659.25, 0.10, 0, 'square', 0.035);
    playTone(523.25, 0.12, 0.11, 'square', 0.03);
  }
}

function loadImage(path) {
  if (!path) return null;
  if (imageCache.has(path)) return imageCache.get(path);
  const img = new Image();
  img.src = path;
  imageCache.set(path, img);
  return img;
}

function renderCharacters() {
  const grid = document.getElementById('characterGrid');
  grid.innerHTML = '';
  characters.forEach(ch => {
    const card = document.createElement('button');
    card.className = 'card';
    const face = ch.image
      ? `<img class='thumb' src='${ch.image}' alt='${ch.name}'>`
      : `<div class='emoji'>${ch.emoji || '🎨'}</div>`;
    card.innerHTML = `${face}<div class='name'>${ch.name}</div>`;
    card.onclick = () => { selected = ch; startGame(); };
    grid.appendChild(card);
  });
}

function resetGame() {
  score = 0;
  timeLeft = 30;
  items = [];
  spawnTimer = 0;
  running = true;
  player = {
    x: canvas.width / 2,
    y: canvas.height - 125,
    size: selected.size,
    targetX: canvas.width / 2
  };
  scoreText.textContent = 'スコア 0';
  timeText.textContent = '30';
  lastTime = performance.now();
}

function startGame() {
  show('game');
  resetGame();
  playSound('start');
  cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(loop);
}

function spawnItem() {
  const kinds = ['⭐','🍎','💖'];
  items.push({
    x: 50 + Math.random() * (canvas.width - 100),
    y: -40,
    r: 30,
    v: 210 + Math.random() * 130,
    mark: kinds[Math.floor(Math.random() * kinds.length)]
  });
}

function drawPlayer() {
  const img = loadImage(selected.image);
  const s = player.size;
  if (img && img.complete && img.naturalWidth) {
    ctx.drawImage(img, player.x - s / 2, player.y - s / 2, s, s);
  } else {
    ctx.font = `${s}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(selected.emoji || '🎨', player.x, player.y);
  }
}

function loop(now) {
  if (!running) return;

  const dt = Math.min((now - lastTime) / 1000, 0.033);
  lastTime = now;
  timeLeft -= dt;
  spawnTimer -= dt;

  if (spawnTimer <= 0) {
    spawnItem();
    spawnTimer = 0.55;
  }

  player.x += (player.targetX - player.x) * 0.25 * selected.speed;
  player.x = Math.max(player.size / 2, Math.min(canvas.width - player.size / 2, player.x));

  items.forEach(it => it.y += it.v * dt);
  items = items.filter(it => {
    const dx = it.x - player.x;
    const dy = it.y - player.y;
    if (Math.hypot(dx, dy) < it.r + player.size * 0.26) {
      score += 1;
      playSound('catch');
      scoreText.textContent = `スコア ${score}`;
      return false;
    }
    return it.y < canvas.height + 60;
  });

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = 'rgba(255,255,255,.55)';
  for (let i = 0; i < 6; i++) {
    ctx.beginPath();
    ctx.arc(80 + i * 120, 90 + (i % 2) * 45, 34, 0, Math.PI * 2);
    ctx.fill();
  }

  items.forEach(it => {
    ctx.font = '48px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(it.mark, it.x, it.y);
  });

  drawPlayer();
  timeText.textContent = Math.max(0, Math.ceil(timeLeft));

  if (timeLeft <= 0) {
    running = false;
    playSound('finish');
    show('result');
    resultText.textContent = `${selected.name}のスコア：${score}`;
    return;
  }

  rafId = requestAnimationFrame(loop);
}

function pointerToCanvasX(e) {
  const rect = canvas.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  return (clientX - rect.left) / rect.width * canvas.width;
}

canvas.addEventListener('pointerdown', e => { if (player) player.targetX = pointerToCanvasX(e); });
canvas.addEventListener('pointermove', e => { if (player) player.targetX = pointerToCanvasX(e); });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (player) player.targetX = pointerToCanvasX(e);
}, { passive:false });

document.getElementById('startBtn').onclick = () => { renderCharacters(); show('select'); };
document.getElementById('backTitleBtn').onclick = () => show('title');
document.getElementById('againBtn').onclick = () => startGame();
document.getElementById('selectAgainBtn').onclick = () => { renderCharacters(); show('select'); };

renderCharacters();
</script>
</body>
</html>
